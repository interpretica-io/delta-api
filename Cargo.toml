[package]
name = "delta-api"
version = "1.7.4"
edition = "2021"
links = "asp"

# Native libasp source pinned here (read by build.rs). The git ref is the single
# place to bump the asp version. Env vars ASP_GIT_URL / ASP_GIT_REF override it.
[package.metadata.asp]
git-url = "https://github.com/interpretica-io/asp"
git-ref = "1.12.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum_macros = "0.26.4"
log = { version = "0.4.0" }
russh = { version = "0.45", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "net"], optional = true }
async-trait = { version = "0.1", optional = true }
ed25519-dalek = { version = "2", optional = true }
getrandom = { version = "0.2", optional = true }

[build-dependencies]
bindgen = "0.70"
toml = "0.8"

# `asp_client` is on by default so existing consumers keep linking libasp with no
# change. Disable it (`default-features = false`) to build without the native
# library — e.g. the wasm WebUI, which only needs the pure data models.
[features]
default = [ "asp_client", "control" ]
object_model = [ "russh", "tokio", "async-trait" ]
# Control-plane command signing (server side of `delta --verify-key`): Ed25519
# keygen + signed-envelope production, byte-compatible with the agent's verifier.
control = [ "ed25519-dalek", "getrandom" ]
# The asp client: FFI bindings + safe wrapper around native libasp
# (`asp_model::connection` / `sys`). Gates both those Rust modules and the libasp
# build in build.rs. The pure asp data models stay available without it.
asp_client = []
# Network server exposing the Delta API (NodePool) over newline-delimited JSON.
server = [ "object_model", "control" ]

[[bin]]
name = "delta-server"
path = "src/bin/delta-server.rs"
required-features = [ "server" ]
