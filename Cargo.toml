[package]
name = "delta-api"
version = "1.3.1"
edition = "2021"
links = "asp"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum_macros = "0.26.4"
log = { version = "0.4.0", optional = true }
russh = { version = "0.45", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "net"], optional = true }
async-trait = { version = "0.1", optional = true }

[build-dependencies]
bindgen = "0.70"

[features]
object_model = [ "log", "russh", "tokio", "async-trait" ]
asp_client = [ "log" ]
# Network server exposing the Delta API (NodePool) over newline-delimited JSON.
server = [ "object_model" ]

[[bin]]
name = "delta-server"
path = "src/bin/delta-server.rs"
required-features = [ "server" ]
