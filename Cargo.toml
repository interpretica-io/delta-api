[package]
name = "delta-api"
version = "1.5.0"
edition = "2021"
links = "asp"

# Native libasp source pinned here (read by build.rs). The git ref is the single
# place to bump the asp version. Env vars ASP_GIT_URL / ASP_GIT_REF override it.
[package.metadata.asp]
git-url = "https://github.com/interpretica-io/asp"
git-ref = "v1.10.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum_macros = "0.26.4"
log = { version = "0.4.0" }
russh = { version = "0.45", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "net"], optional = true }
async-trait = { version = "0.1", optional = true }

[build-dependencies]
bindgen = "0.70"
toml = "0.8"

[features]
object_model = [ "russh", "tokio", "async-trait" ]
# The asp client (FFI to native libasp) is always compiled in now, so this
# feature is a no-op. It is kept so existing `delta-api/asp_client` references in
# downstream crates keep resolving.
asp_client = []
# Network server exposing the Delta API (NodePool) over newline-delimited JSON.
server = [ "object_model" ]

[[bin]]
name = "delta-server"
path = "src/bin/delta-server.rs"
required-features = [ "server" ]
